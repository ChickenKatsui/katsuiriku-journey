<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0.72" y2="1">
      <stop offset="0" stop-color="#F8EEE7"/>
      <stop offset=".46" stop-color="#E7CDC7"/>
      <stop offset="1" stop-color="#D9A6A6"/>
    </linearGradient>
    <radialGradient id="rose" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#B86B6B" stop-opacity=".34"/>
      <stop offset=".52" stop-color="#B86B6B" stop-opacity=".11"/>
      <stop offset="1" stop-color="#B86B6B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sage" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6F8B7E" stop-opacity=".22"/>
      <stop offset=".56" stop-color="#6F8B7E" stop-opacity=".06"/>
      <stop offset="1" stop-color="#6F8B7E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gold" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#C9A227" stop-opacity=".26"/>
      <stop offset=".56" stop-color="#C9A227" stop-opacity=".06"/>
      <stop offset="1" stop-color="#C9A227" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8E6AA8" stop-opacity=".2"/>
      <stop offset=".56" stop-color="#8E6AA8" stop-opacity=".05"/>
      <stop offset="1" stop-color="#8E6AA8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="portal" cx="50%" cy="48%" r="50%">
      <stop offset="0" stop-color="#FBF4EC" stop-opacity=".55"/>
      <stop offset=".48" stop-color="#F4E7DA" stop-opacity=".26"/>
      <stop offset=".78" stop-color="#D9A6A6" stop-opacity=".12"/>
      <stop offset="1" stop-color="#D9A6A6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="thread" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B86B6B" stop-opacity="0"/>
      <stop offset=".32" stop-color="#B86B6B" stop-opacity=".26"/>
      <stop offset=".62" stop-color="#C9A227" stop-opacity=".2"/>
      <stop offset=".86" stop-color="#8E6AA8" stop-opacity=".14"/>
      <stop offset="1" stop-color="#8E6AA8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="foil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C9A227" stop-opacity="0"/>
      <stop offset=".45" stop-color="#C9A227" stop-opacity=".34"/>
      <stop offset=".72" stop-color="#F6D38B" stop-opacity=".28"/>
      <stop offset="1" stop-color="#C9A227" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="46%" r="74%">
      <stop offset="0" stop-color="#FBF4EC" stop-opacity="0"/>
      <stop offset=".7" stop-color="#FBF4EC" stop-opacity=".08"/>
      <stop offset="1" stop-color="#FBF4EC" stop-opacity=".5"/>
    </radialGradient>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="58"/>
    </filter>
    <filter id="blur-small" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="starGlow" x="-240%" y="-240%" width="580%" height="580%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="stars" width="210" height="210" patternUnits="userSpaceOnUse">
      <circle cx="18" cy="24" r="1.1" fill="#8E4F4F" opacity=".22"/>
      <circle cx="86" cy="68" r=".8" fill="#C9A227" opacity=".3"/>
      <circle cx="150" cy="32" r="1.4" fill="#3A2620" opacity=".16"/>
      <circle cx="188" cy="118" r=".9" fill="#C9A227" opacity=".26"/>
      <circle cx="42" cy="152" r=".8" fill="#8E4F4F" opacity=".18"/>
      <circle cx="116" cy="184" r="1.2" fill="#3A2620" opacity=".12"/>
      <circle cx="174" cy="198" r=".7" fill="#C9A227" opacity=".2"/>
      <circle cx="68" cy="104" r=".6" fill="#8E4F4F" opacity=".14"/>
    </pattern>
    <pattern id="weave" width="96" height="96" patternUnits="userSpaceOnUse">
      <path d="M0 24 H96 M0 72 H96" stroke="#8E4F4F" stroke-opacity=".035" stroke-width="1"/>
      <path d="M24 0 V96 M72 0 V96" stroke="#C9A227" stroke-opacity=".04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#base)"/>
  <ellipse cx="260" cy="130" rx="650" ry="560" fill="url(#sage)" filter="url(#blur)" opacity=".9"/>
  <ellipse cx="1700" cy="880" rx="680" ry="540" fill="url(#rose)" filter="url(#blur)" opacity=".82"/>
  <ellipse cx="1480" cy="320" rx="460" ry="380" fill="url(#gold)" filter="url(#blur)" opacity=".58"/>
  <ellipse cx="980" cy="560" rx="520" ry="460" fill="url(#violet)" filter="url(#blur)" opacity=".5"/>

  <rect width="1920" height="1080" fill="url(#weave)" opacity=".8"/>
  <rect width="1920" height="1080" fill="url(#stars)" opacity=".72"/>

  <g opacity=".9">
    <circle cx="1400" cy="500" r="470" fill="url(#portal)"/>
    <circle cx="1400" cy="500" r="470" fill="none" stroke="#8E4F4F" stroke-opacity=".12" stroke-width="1.4"/>
    <circle cx="1400" cy="500" r="390" fill="none" stroke="#C9A227" stroke-opacity=".16" stroke-width="1.2" stroke-dasharray="3 15"/>
    <ellipse cx="1400" cy="500" rx="560" ry="220" fill="none" stroke="#8E4F4F" stroke-opacity=".13" transform="rotate(-18 1400 500)"/>
    <ellipse cx="1400" cy="500" rx="430" ry="340" fill="none" stroke="#C9A227" stroke-opacity=".12" transform="rotate(26 1400 500)"/>
    <circle cx="1400" cy="500" r="520" fill="none" stroke="#8E6AA8" stroke-opacity=".08" stroke-dasharray="2 18"/>
  </g>

  <g fill="none" stroke-linecap="round">
    <path d="M-80 820 C 260 640, 420 900, 720 720 C 1010 548, 1180 700, 1480 520 C 1700 390, 1850 470, 2020 320" stroke="url(#thread)" stroke-width="2.4"/>
    <path d="M-40 880 C 300 760, 520 940, 820 800 C 1080 680, 1280 800, 1580 640 C 1770 540, 1890 580, 2000 500" stroke="#8E4F4F" stroke-opacity=".1" stroke-width="1.2"/>
    <path d="M-20 980 C 330 840, 600 980, 900 860 C 1180 748, 1420 860, 1700 700 C 1840 620, 1920 640, 1990 600" stroke="#C9A227" stroke-opacity=".12" stroke-width="1.4" stroke-dasharray="2 12"/>
  </g>

  <g fill="#B86B6B">
    <circle cx="720" cy="720" r="4" opacity=".28"/>
    <circle cx="1480" cy="520" r="3.2" opacity=".24"/>
    <circle cx="900" cy="860" r="2.8" opacity=".2"/>
  </g>
  <g fill="#C9A227" filter="url(#starGlow)">
    <circle cx="720" cy="720" r="2" opacity=".55"/>
    <circle cx="1480" cy="520" r="1.7" opacity=".5"/>
  </g>

  <g fill="none" stroke="#C9A227" stroke-opacity=".24" stroke-width="1.4">
    <path d="M110 160 C 250 70, 410 100, 500 210 C 590 320, 540 430, 420 470" stroke="url(#foil)"/>
    <path d="M1820 940 C 1700 1020, 1540 980, 1460 880 C 1380 780, 1420 690, 1540 650" stroke="url(#foil)"/>
  </g>

  <g opacity=".55">
    <rect x="170" y="690" width="250" height="160" rx="18" fill="#FBF4EC" fill-opacity=".28" stroke="#8E4F4F" stroke-opacity=".12" transform="rotate(-7 295 770)"/>
    <rect x="1540" y="150" width="290" height="180" rx="20" fill="#FBF4EC" fill-opacity=".22" stroke="#8E4F4F" stroke-opacity=".12" transform="rotate(6 1685 240)"/>
    <rect x="1570" y="730" width="230" height="150" rx="18" fill="#FBF4EC" fill-opacity=".2" stroke="#8E4F4F" stroke-opacity=".1" transform="rotate(-5 1685 805)"/>
  </g>

  <g fill="none" stroke="#8E4F4F" stroke-opacity=".18" stroke-width="1">
    <path d="M1120 180 L1240 250 L1380 200 L1510 300 L1660 260"/>
    <path d="M1240 250 L1300 390 L1450 430 L1510 300"/>
  </g>
  <g fill="#C9A227" filter="url(#starGlow)">
    <circle cx="1120" cy="180" r="2.2" opacity=".55"/>
    <circle cx="1240" cy="250" r="1.8" opacity=".5"/>
    <circle cx="1380" cy="200" r="2.4" opacity=".55"/>
    <circle cx="1510" cy="300" r="1.7" opacity=".45"/>
    <circle cx="1660" cy="260" r="2" opacity=".5"/>
    <circle cx="1300" cy="390" r="1.5" opacity=".4"/>
    <circle cx="1450" cy="430" r="1.8" opacity=".45"/>
  </g>

  <g fill="#8E4F4F">
    <circle cx="1220" cy="146" r="2.4" opacity=".34"/>
    <circle cx="1580" cy="220" r="1.7" opacity=".26"/>
    <circle cx="1730" cy="520" r="2.1" opacity=".3"/>
    <circle cx="980" cy="330" r="1.5" opacity=".22"/>
    <circle cx="140" cy="710" r="1.8" opacity=".24"/>
    <circle cx="420" cy="860" r="1.4" opacity=".2"/>
    <circle cx="760" cy="140" r="1.2" opacity=".2"/>
  </g>
  <g fill="#C9A227">
    <circle cx="1638" cy="146" r="3.2" opacity=".55"/>
    <circle cx="1070" cy="740" r="2.6" opacity=".4"/>
    <circle cx="1860" cy="680" r="2.1" opacity=".38"/>
    <circle cx="520" cy="300" r="2.4" opacity=".34"/>
  </g>

  <ellipse cx="960" cy="1080" rx="920" ry="260" fill="#B86B6B" opacity=".05" filter="url(#blur-small)"/>
  <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>
