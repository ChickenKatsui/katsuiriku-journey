<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#FCF6EF"/>
      <stop offset=".44" stop-color="#F4E7DA"/>
      <stop offset="1" stop-color="#E8C9C2"/>
    </linearGradient>
    <radialGradient id="peach" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#E9A98D" stop-opacity=".28"/>
      <stop offset=".55" stop-color="#D9A6A6" stop-opacity=".1"/>
      <stop offset="1" stop-color="#D9A6A6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rose" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#B86B6B" stop-opacity=".26"/>
      <stop offset=".58" stop-color="#B86B6B" stop-opacity=".08"/>
      <stop offset="1" stop-color="#B86B6B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gold" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#C9A227" stop-opacity=".24"/>
      <stop offset=".6" stop-color="#C9A227" stop-opacity=".06"/>
      <stop offset="1" stop-color="#C9A227" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8E6AA8" stop-opacity=".16"/>
      <stop offset=".6" stop-color="#8E6AA8" stop-opacity=".04"/>
      <stop offset="1" stop-color="#8E6AA8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="crystal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF9EF" stop-opacity=".95"/>
      <stop offset=".3" stop-color="#F2D3CE" stop-opacity=".78"/>
      <stop offset=".62" stop-color="#D98E9E" stop-opacity=".46"/>
      <stop offset=".84" stop-color="#8E6AA8" stop-opacity=".26"/>
      <stop offset="1" stop-color="#C9A227" stop-opacity=".2"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF9EF" stop-opacity=".74"/>
      <stop offset="1" stop-color="#F4E7DA" stop-opacity=".3"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="45%" r="72%">
      <stop offset="0" stop-color="#FBF4EC" stop-opacity="0"/>
      <stop offset=".7" stop-color="#FBF4EC" stop-opacity=".08"/>
      <stop offset="1" stop-color="#FBF4EC" stop-opacity=".55"/>
    </radialGradient>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <filter id="blur-small" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="starGlow" x="-240%" y="-240%" width="580%" height="580%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="stars" width="220" height="220" patternUnits="userSpaceOnUse">
      <circle cx="22" cy="38" r=".9" fill="#8E4F4F" opacity=".18"/>
      <circle cx="84" cy="76" r=".7" fill="#C9A227" opacity=".2"/>
      <circle cx="148" cy="30" r="1.1" fill="#3A2620" opacity=".12"/>
      <circle cx="186" cy="146" r=".8" fill="#8E4F4F" opacity=".14"/>
      <circle cx="52" cy="176" r=".7" fill="#C9A227" opacity=".16"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#base)"/>
  <ellipse cx="420" cy="160" rx="680" ry="540" fill="url(#peach)" filter="url(#blur)" opacity=".9"/>
  <ellipse cx="1560" cy="780" rx="760" ry="580" fill="url(#rose)" filter="url(#blur)" opacity=".82"/>
  <ellipse cx="1180" cy="260" rx="500" ry="400" fill="url(#gold)" filter="url(#blur)" opacity=".62"/>
  <ellipse cx="940" cy="620" rx="520" ry="400" fill="url(#violet)" filter="url(#blur)" opacity=".45"/>

  <rect width="1920" height="1080" fill="url(#stars)" opacity=".62"/>

  <g opacity=".8">
    <g transform="rotate(-7 305 260)">
      <rect x="180" y="180" width="250" height="160" rx="18" fill="url(#frame)" stroke="#8E4F4F" stroke-opacity=".16" stroke-width="1.4"/>
      <path d="M220 290 C 250 250, 280 250, 310 290" fill="none" stroke="#8E4F4F" stroke-opacity=".2" stroke-width="2"/>
      <circle cx="300" cy="230" r="12" fill="#C9A227" opacity=".28"/>
      <path d="M300 218 l 3 9 l 9 3 l -9 3 l -3 9 l -3 -9 l -9 -3 l 9 -3 Z" fill="#C9A227" opacity=".35"/>
    </g>
    <g transform="rotate(6 1615 280)">
      <rect x="1470" y="190" width="290" height="180" rx="20" fill="url(#frame)" stroke="#8E4F4F" stroke-opacity=".16" stroke-width="1.4"/>
      <path d="M1505 330 L1545 250 L1585 330 Z" fill="#8E6AA8" opacity=".12"/>
      <path d="M1585 330 L1630 270 L1675 330 Z" fill="#8E4F4F" opacity=".1"/>
      <circle cx="1660" cy="240" r="13" fill="#C9A227" opacity=".3"/>
      <path d="M1510 350 H1720" stroke="#8E4F4F" stroke-opacity=".14" stroke-width="2"/>
      <g opacity=".82">
        <path d="M1538 330 L1544 258 L1562 258 L1568 330 Z" fill="#8E4F4F" opacity=".2"/>
        <rect x="1544" y="246" width="18" height="12" rx="3" fill="#C9A227" opacity=".34"/>
        <path d="M1542 246 L1553 234 L1564 246 Z" fill="#8E4F4F" opacity=".22"/>
        <circle cx="1553" cy="252" r="4" fill="#C9A227" opacity=".5" filter="url(#starGlow)"/>
        <path d="M1553 252 L1500 232" stroke="#C9A227" stroke-opacity=".22" stroke-width="2"/>
        <path d="M1553 252 L1606 232" stroke="#C9A227" stroke-opacity=".22" stroke-width="2"/>
      </g>
    </g>
    <g transform="rotate(-5 1545 735)">
      <rect x="1430" y="660" width="230" height="150" rx="18" fill="url(#frame)" stroke="#8E4F4F" stroke-opacity=".14" stroke-width="1.4"/>
      <path d="M1460 760 C 1490 720, 1520 720, 1550 760 C 1580 800, 1610 800, 1640 760" fill="none" stroke="#6F8B7E" stroke-opacity=".22" stroke-width="2"/>
      <circle cx="1620" cy="700" r="9" fill="#C9A227" opacity=".26"/>
    </g>
    <g transform="rotate(8 355 770)">
      <rect x="250" y="700" width="210" height="140" rx="18" fill="url(#frame)" stroke="#8E4F4F" stroke-opacity=".14" stroke-width="1.4"/>
      <path d="M285 790 C 305 760, 335 760, 355 790 C 375 820, 405 820, 425 790" fill="none" stroke="#B86B6B" stroke-opacity=".22" stroke-width="2"/>
      <circle cx="310" cy="740" r="10" fill="#8E6AA8" opacity=".18"/>
    </g>
    <g transform="rotate(-4 1180 880)">
      <rect x="1060" y="820" width="240" height="130" rx="18" fill="url(#frame)" stroke="#8E4F4F" stroke-opacity=".12" stroke-width="1.2"/>
      <path d="M1100 910 C 1130 870, 1160 870, 1190 910 C 1220 950, 1250 950, 1280 910" fill="none" stroke="#C9A227" stroke-opacity=".2" stroke-width="2"/>
      <path d="M1110 870 l 3 8 l 8 3 l -8 3 l -3 8 l -3 -8 l -8 -3 l 8 -3 Z" fill="#C9A227" opacity=".25"/>
    </g>
  </g>

  <g opacity=".82">
    <path d="M960 220 L1050 470 L960 740 L870 470 Z" fill="url(#crystal)" filter="url(#blur-small)"/>
    <path d="M960 270 L1022 470 L960 680 L898 470 Z" fill="url(#crystal)" opacity=".74"/>
    <path d="M960 270 L960 680" stroke="#FFF9EF" stroke-opacity=".7" stroke-width="1.2"/>
    <path d="M898 470 L1022 470" stroke="#FFF9EF" stroke-opacity=".6" stroke-width="1.2"/>
    <path d="M960 220 L1022 470 L960 680" fill="none" stroke="#8E4F4F" stroke-opacity=".14" stroke-width="1.2"/>
    <path d="M960 220 L898 470 L960 680" fill="none" stroke="#8E4F4F" stroke-opacity=".12" stroke-width="1.2"/>
    <circle cx="960" cy="470" r="6" fill="#C9A227" opacity=".6" filter="url(#starGlow)"/>
  </g>

  <g fill="none" stroke-linecap="round">
    <path d="M-60 840 C 300 700, 520 860, 820 700 C 1120 540, 1320 700, 1620 520 C 1780 430, 1880 460, 2010 380" stroke="#B86B6B" stroke-opacity=".14" stroke-width="2"/>
    <path d="M-40 920 C 320 800, 560 940, 860 780 C 1140 630, 1360 760, 1660 600 C 1800 530, 1900 550, 2000 500" stroke="#C9A227" stroke-opacity=".12" stroke-width="1.4" stroke-dasharray="2 12"/>
  </g>

  <g fill="#8E4F4F">
    <circle cx="340" cy="240" r="2" opacity=".26"/>
    <circle cx="1510" cy="270" r="1.6" opacity=".22"/>
    <circle cx="1220" cy="760" r="1.4" opacity=".18"/>
    <circle cx="700" cy="860" r="1.8" opacity=".2"/>
    <circle cx="1730" cy="500" r="1.5" opacity=".2"/>
  </g>
  <g fill="#C9A227" filter="url(#starGlow)">
    <circle cx="760" cy="340" r="2.6" opacity=".4"/>
    <circle cx="1320" cy="620" r="2.2" opacity=".34"/>
    <circle cx="560" cy="640" r="1.8" opacity=".28"/>
    <circle cx="1080" cy="180" r="2" opacity=".3"/>
  </g>

  <ellipse cx="960" cy="1100" rx="900" ry="250" fill="#B86B6B" opacity=".05" filter="url(#blur-small)"/>
  <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>
