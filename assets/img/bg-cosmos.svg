<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#F8EEE7"/>
      <stop offset=".48" stop-color="#E8CBC6"/>
      <stop offset="1" stop-color="#D8A8B0"/>
    </linearGradient>
    <radialGradient id="violet" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8E6AA8" stop-opacity=".26"/>
      <stop offset=".58" stop-color="#8E6AA8" stop-opacity=".08"/>
      <stop offset="1" stop-color="#8E6AA8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rose" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#B86B6B" stop-opacity=".28"/>
      <stop offset=".58" stop-color="#B86B6B" stop-opacity=".08"/>
      <stop offset="1" stop-color="#B86B6B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sage" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6F8B7E" stop-opacity=".2"/>
      <stop offset=".6" stop-color="#6F8B7E" stop-opacity=".05"/>
      <stop offset="1" stop-color="#6F8B7E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gold" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#C9A227" stop-opacity=".24"/>
      <stop offset=".6" stop-color="#C9A227" stop-opacity=".06"/>
      <stop offset="1" stop-color="#C9A227" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planet" cx="32%" cy="28%" r="76%">
      <stop offset="0" stop-color="#FFF9EF"/>
      <stop offset=".2" stop-color="#F3D5C8"/>
      <stop offset=".44" stop-color="#D9A6A6"/>
      <stop offset=".68" stop-color="#B86B6B"/>
      <stop offset=".86" stop-color="#8E6AA8"/>
      <stop offset="1" stop-color="#5F3C66"/>
    </radialGradient>
    <radialGradient id="moon" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#FFF9EF"/>
      <stop offset=".55" stop-color="#F4E7DA"/>
      <stop offset="1" stop-color="#D9A6A6"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6D38B" stop-opacity=".5"/>
      <stop offset=".45" stop-color="#C9A227" stop-opacity=".32"/>
      <stop offset="1" stop-color="#B86B6B" stop-opacity=".16"/>
    </linearGradient>
    <linearGradient id="thread" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C9A227" stop-opacity="0"/>
      <stop offset=".35" stop-color="#C9A227" stop-opacity=".3"/>
      <stop offset=".65" stop-color="#B86B6B" stop-opacity=".24"/>
      <stop offset="1" stop-color="#B86B6B" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="45%" r="72%">
      <stop offset="0" stop-color="#FBF4EC" stop-opacity="0"/>
      <stop offset=".7" stop-color="#FBF4EC" stop-opacity=".08"/>
      <stop offset="1" stop-color="#FBF4EC" stop-opacity=".55"/>
    </radialGradient>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="64"/>
    </filter>
    <filter id="blur-small" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="starGlow" x="-240%" y="-240%" width="580%" height="580%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="stars" width="190" height="190" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="34" r="1" fill="#8E4F4F" opacity=".22"/>
      <circle cx="72" cy="92" r=".8" fill="#C9A227" opacity=".24"/>
      <circle cx="142" cy="26" r="1.2" fill="#3A2620" opacity=".14"/>
      <circle cx="168" cy="132" r=".7" fill="#C9A227" opacity=".22"/>
      <circle cx="46" cy="158" r="1.1" fill="#8E4F4F" opacity=".16"/>
      <circle cx="108" cy="178" r=".6" fill="#3A2620" opacity=".12"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#base)"/>
  <ellipse cx="1520" cy="180" rx="640" ry="520" fill="url(#violet)" filter="url(#blur)" opacity=".9"/>
  <ellipse cx="360" cy="880" rx="720" ry="540" fill="url(#rose)" filter="url(#blur)" opacity=".82"/>
  <ellipse cx="1180" cy="860" rx="480" ry="400" fill="url(#sage)" filter="url(#blur)" opacity=".65"/>
  <ellipse cx="980" cy="320" rx="520" ry="360" fill="url(#gold)" filter="url(#blur)" opacity=".55"/>

  <rect width="1920" height="1080" fill="url(#stars)" opacity=".72"/>

  <g opacity=".9">
    <circle cx="1510" cy="480" r="260" fill="url(#planet)" opacity=".18" filter="url(#blur-small)"/>
    <circle cx="1510" cy="480" r="180" fill="url(#planet)" opacity=".92"/>
    <circle cx="1510" cy="480" r="180" fill="none" stroke="#8E4F4F" stroke-opacity=".16" stroke-width="1.6"/>
    <path d="M1360 380 C 1430 330, 1550 330, 1630 390" fill="none" stroke="#FFF9EF" stroke-opacity=".24" stroke-width="8" stroke-linecap="round"/>
    <ellipse cx="1510" cy="480" rx="300" ry="64" fill="none" stroke="url(#ring)" stroke-width="14" transform="rotate(-16 1510 480)"/>
    <ellipse cx="1510" cy="480" rx="330" ry="78" fill="none" stroke="#C9A227" stroke-opacity=".2" stroke-width="1.6" transform="rotate(-16 1510 480)"/>
    <ellipse cx="1510" cy="480" rx="360" ry="100" fill="none" stroke="#8E4F4F" stroke-opacity=".1" stroke-width="1.2" transform="rotate(-16 1510 480)"/>
  </g>

  <g opacity=".9">
    <circle cx="1190" cy="220" r="44" fill="url(#moon)" opacity=".9"/>
    <circle cx="1190" cy="220" r="44" fill="none" stroke="#8E4F4F" stroke-opacity=".12"/>
    <circle cx="1178" cy="206" r="10" fill="#FFF9EF" opacity=".5"/>
    <circle cx="1204" cy="236" r="7" fill="#D9A6A6" opacity=".4"/>
  </g>

  <g fill="none" stroke-linecap="round">
    <path d="M-100 780 C 220 640, 420 740, 620 580 C 840 404, 980 520, 1160 400 C 1380 250, 1580 340, 2020 180" stroke="url(#thread)" stroke-width="2.2"/>
    <path d="M-80 860 C 260 760, 460 880, 700 720 C 920 576, 1080 650, 1320 520 C 1560 390, 1780 470, 2020 380" stroke="#B86B6B" stroke-opacity=".1" stroke-width="1.2"/>
    <path d="M-60 960 C 280 840, 520 940, 760 800 C 980 670, 1180 760, 1420 640 C 1640 530, 1800 570, 2000 480" stroke="#C9A227" stroke-opacity=".12" stroke-width="1.4" stroke-dasharray="2 12"/>
  </g>

  <g fill="none" stroke="#C9A227" stroke-opacity=".22" stroke-width="1.2">
    <circle cx="1510" cy="480" r="310" stroke-dasharray="2 18"/>
    <ellipse cx="1510" cy="480" rx="380" ry="126" transform="rotate(24 1510 480)"/>
    <ellipse cx="1510" cy="480" rx="430" ry="180" transform="rotate(-30 1510 480)"/>
  </g>

  <g fill="none" stroke="#8E4F4F" stroke-opacity=".18" stroke-width="1.1">
    <path d="M240 300 L360 250 L470 340 L610 290 L700 400"/>
    <path d="M360 250 L410 150 L540 120 L610 290"/>
    <path d="M470 340 L560 450 L700 400"/>
  </g>
  <g fill="#C9A227" filter="url(#starGlow)">
    <circle cx="240" cy="300" r="2.6" opacity=".55"/>
    <circle cx="360" cy="250" r="2" opacity=".5"/>
    <circle cx="470" cy="340" r="2.3" opacity=".5"/>
    <circle cx="610" cy="290" r="1.8" opacity=".45"/>
    <circle cx="700" cy="400" r="2.1" opacity=".5"/>
    <circle cx="410" cy="150" r="1.7" opacity=".42"/>
    <circle cx="540" cy="120" r="2" opacity=".46"/>
    <circle cx="560" cy="450" r="1.6" opacity=".4"/>
  </g>

  <g fill="#8E4F4F">
    <circle cx="240" cy="210" r="2.3" opacity=".3"/>
    <circle cx="520" cy="150" r="1.4" opacity=".2"/>
    <circle cx="1040" cy="180" r="1.8" opacity=".24"/>
    <circle cx="1780" cy="780" r="1.5" opacity=".22"/>
    <circle cx="840" cy="760" r="1.2" opacity=".18"/>
    <circle cx="120" cy="620" r="1.6" opacity=".2"/>
  </g>
  <g fill="#C9A227">
    <circle cx="410" cy="420" r="3" opacity=".5"/>
    <circle cx="980" cy="560" r="2.2" opacity=".36"/>
    <circle cx="1320" cy="260" r="2.6" opacity=".42"/>
    <circle cx="720" cy="180" r="2.1" opacity=".34"/>
  </g>

  <ellipse cx="960" cy="1100" rx="920" ry="240" fill="#8E6AA8" opacity=".05" filter="url(#blur-small)"/>
  <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>
